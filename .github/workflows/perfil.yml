# Una vez al dia: lee la API de GitHub con el token del propio repo, regenera la ficha y la commitea solo si
# algo cambio (el Uptime cambia cada dia; los numeros, cuando hay actividad). Si la API falla, el paso falla y
# se queda la ficha anterior: nunca se commitea una ficha a medias.
name: ficha del perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ficha-del-perfil
  cancel-in-progress: false

jobs:
  ficha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas del generador
        run: python3 -m unittest discover -s tests

      - name: Regenerar con la API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 perfil/generar.py

      - name: Commit solo si cambio algo
        run: |
          git add assets cache
          if git diff --cached --quiet; then
            echo "sin cambios: no hay commit"
            exit 0
          fi
          git -c user.name="ZERACK" -c user.email="189363748+itzjk@users.noreply.github.com" \
            commit -m "Ficha del perfil: datos del $(date -u +%F)"
          git push
